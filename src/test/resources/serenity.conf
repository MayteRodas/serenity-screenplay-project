webdriver {
    driver = edge
    capabilities { browserName = "MicrosoftEdge" }
}
drivers {
    windows {
        webdriver.edge.driver = "src/test/resources/drivers/msedgedriver.exe"
    }
}
serenity {
    project.name = "Proyecto Serenity Screenplay"
    take.screenshots = FOR_EACH_ACTION
    reports.show.step.details = true
    outputDirectory = "build/site/serenity"
}
headless.mode = false