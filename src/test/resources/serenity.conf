webdriver {
    driver = edge
    capabilities {
        browserName = "MicrosoftEdge"
    }
}

drivers {
    windows {
        webdriver.edge.driver = "C:/drivers/edge/edgedriver_win64/msedgedriver.exe"
    }
}

serenity {
    project.name = "Proyecto Serenity Screenplay"
    take.screenshots = FOR_EACH_ACTION
    reports.show.step.details = true
    outputDirectory = "build/site/serenity"
}

headless.mode = false