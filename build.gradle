plugins { id 'java' }
group = 'com.proyecto'
version = '1.0-SNAPSHOT'
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
repositories { mavenCentral() }
ext {
    serenityVersion = '4.1.20'
    cucumberVersion = '7.15.0'
    junitVersion = '5.10.1'
}
dependencies {
    testImplementation "net.serenity-bdd:serenity-core:${serenityVersion}"
    testImplementation "net.serenity-bdd:serenity-cucumber:${serenityVersion}"
    testImplementation "net.serenity-bdd:serenity-screenplay:${serenityVersion}"
    testImplementation "net.serenity-bdd:serenity-screenplay-webdriver:${serenityVersion}"
    testImplementation "net.serenity-bdd:serenity-ensure:${serenityVersion}"
    testImplementation "io.cucumber:cucumber-java:${cucumberVersion}"
    testImplementation "io.cucumber:cucumber-junit-platform-engine:${cucumberVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
    testImplementation "org.junit.platform:junit-platform-launcher:1.10.1"
    testImplementation "org.junit.platform:junit-platform-suite-api:1.10.1"
    testImplementation "org.junit.platform:junit-platform-suite-engine:1.10.1"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
    testImplementation 'org.assertj:assertj-core:3.24.2'
    testImplementation 'org.slf4j:slf4j-simple:2.0.9'
}
test {
    useJUnitPlatform()
    systemProperty 'cucumber.junit-platform.naming-strategy', 'long'
    testLogging { events "passed", "skipped", "failed"; showStandardStreams = true }
}
//gradle.startParameter.continueOnFailure = true

task aggregate(type: JavaExec) {
    group = 'Serenity'
    dependsOn compileTestJava
    classpath = configurations.testRuntimeClasspath + sourceSets.test.output
    mainClass = 'com.proyecto.GenerateReport'
    args = ["${buildDir}/site/serenity"]
    ignoreExitValue = true
}

test.finalizedBy aggregate